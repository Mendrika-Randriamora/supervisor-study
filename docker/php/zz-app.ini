; Paramètres PHP adaptés aux envois de PDF et de photos depuis un smartphone.
upload_max_filesize = 20M
post_max_size = 24M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120

date.timezone = UTC
expose_php = Off

; Cache d'opcodes pour la production.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
